 Зон риска и тонировке задних стекол. Работу сделал за 2 дня, можно приехать в любой момент, посмотреть процесс работы или попросить фотографии. По качеству вопросов не возникло. Есть гарантия, в целом ребята знают свое дело, буду рекомендовать! Спасибо!",avatarLetter:"К",carPhoto:"./photo/korton/korton_1.jpg"},{id:"rev-2",author:"Андрей Кремешков",level:"Знаток города 2 уровня",car:"Geely Monjaro",rating:5,date:"1 мая 2026",service:"Оклейка нового авто бронепленкой",text:"Приветствую всех! Приобрёл в салоне Джили Монджаро. В салоне мне насоветовали сделать бронеплёнку в подарок, но я отказался в силу того, что предыдущий автомобиль мне оклеили в Кортоне. Александр-администратор проконсультировал меня по поводу качества работ и качества материала (что очень важно!), в чём в последствии я убедился — прежде всего качество, ведь я не бронирую автомобиль на краткосрочную перспективу. Не стал рисковать! Оклеил машину в проверенном месте. Огромное спасибо Александру и его команде! Сделали супер!",avatarLetter:"А",carPhoto:"./photo/korton/korton_2.jpg"},{id:"rev-3",author:"Василий Д.",level:"Знаток города 4 уровня",car:"Седан",rating:5,date:"27 июня 2026",service:"Оклейка ударной части + тонировка хамелеон",text:"Ребята работают отлично. Обтянули всю морду и сделали тонировку на лобовое хамелеон + атермалку на передние боковые. Качество работы на 10 из 10. По срокам как обещали и с запасом. Ценник более чем адекватный. Крайне рекомендую.",avatarLetter:"В",carPhoto:"./photo/korton/korton_7.jpg"},{id:"rev-4",author:"Дмитрий",level:"Знаток города 2 уровня",car:"Кроссовер",rating:5,date:"30 мая 2026",service:"Защитная пленка зон риска и тонировка",text:"Обратился по поводу закатки защитной пленкой всех зон риска. Всё сделали быстро и качественно, ребята мастера своего дела и доброжелательные. Теперь буду обслуживаться здесь. Сделаю ещё тонер «хамелеон». На соседней машине делали, мне понравилось, очень красиво!",avatarLetter:"Д",carPhoto:"./photo/korton/korton_3.jpg"},{id:"rev-5",author:"Андрей Б.",level:"Знаток города 5 уровня",car:"Внедорожник",rating:5,date:"22 мая 2026",service:"Антикор, тонировка, керамика и зоны риска",text:"Поехал по рекомендации… Делал антикор, тонировку, покрытие керамикой, зоны риска. Сделали ребята от души. По цене договориться можно и прийти к общему знаменателю, не завышают ценник. Профессионалы!",avatarLetter:"А",carPhoto:"./photo/korton/korton_4.jpg"},{id:"rev-6",author:"Виталий С.",level:"Знаток города 4 уровня",car:"Иномарка",rating:5,date:"19 мая 2026",service:"Комплексный детейлинг и оклейка",text:"Всем привет! В данном месте не первый раз! Хочу поблагодарить ребят за их профессионализм, чёткость, выразить огромное спасибо за качественно выполненные работы, за советы и рекомендации, за индивидуальный подход к клиентам, очень всё нравится!",avatarLetter:"В",carPhoto:"./photo/korton/korton_5.jpg"}],Xg=()=>{const[p,j]=tt.useState(0),[E,o]=tt.useState(!1),[C,_]=tt.useState(0),Q=5e3,J=50;tt.useEffect(()=>{if(E)return;const z=setInterval(()=>{_(V=>V>=100?(j(ut=>(ut+1)%Na.length),0):V+J/Q*100)},J);return()=>clearInterval(z)},[E]);const $=z=>{j(z),_(0)},k=()=>{j(z=>(z-1+Na.length)%Na.length),_(0)},O=()=>{j(z=>(z+1)%Na.length),_(0)},h=Na[p];return c.jsxs("section",{id:"reviews",className:"py-28 px-4 md:px-10 bg-black/75 backdrop-blur-sm text-white relative overflow-hidden",children:[c.jsx("div",{className:"absolute top-1/2 left-1/4 -translate-y-1/2 w-96 h-96 bg-white/[0.02] rounded-full blur-3xl pointer-events-none"}),c.jsx("div",{className:"absolute bottom-10 right-1/4 w-80 h-80 bg-white/[0.015] rounded-full blur-3xl pointer-events-none"}),c.jsxs("div",{className:"max-w-6xl mx-auto relative z-10",children:[c.jsxs("div",{className:"flex flex-col md:flex-row md:items-end justify-between mb-12 gap-6",children:[c.jsx("div",{children:c.jsx("h2",{className:"text-4xl md:text-6xl font-medium tracking-tight lowercase",children:"отзывы клиентов"})}),c.jsxs("div",{className:"flex items-center gap-4 bg-neutral-900/90 bord
